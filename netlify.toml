[build]
  command = "yarn build:netlify"
  publish = "public"
  # Use the newer Ubuntu Jammy build image (22.04) to avoid end-of-life images
  image = "ubuntu-jammy"
  
  # The build:netlify script automatically ensures directories exist
  # using the scripts/ensure-directories.js script which creates 
  # static/audio with placeholder files if needed

[build.environment]
  # Use Node 22.x (latest patch) for longer support
  NODE_VERSION = "22"
  # Bypass WordPress — blog.jeldonmusic.com/graphql is currently returning 404.
  # Set to "false" once WPGraphQL + WPGatsby plugins are active on the WP site.
  BYPASS_WORDPRESS = "true"
  NPM_FLAGS = "--prefer-offline --no-audit"
  YARN_FLAGS = "--prefer-offline --no-audit"
  NODE_OPTIONS = "--max_old_space_size=4096"

[[plugins]]
  package = "@netlify/plugin-gatsby"

[context.deploy-preview.environment]
  # Use bypass mode for Deploy Previews so previews match local development
  # (local dev often uses BYPASS_WORDPRESS=true to use mock/demo content)
  BYPASS_WORDPRESS = "true"

# Security headers. The CSP is deliberately permissive enough for a default
# Gatsby build (inline scripts/styles via 'unsafe-inline', all https images,
# the Samply facade iframe) while still satisfying Lighthouse's CSP check and
# blocking mixed content / object-src / foreign frame-ancestors. Tighten the
# img-src/connect-src https: wildcards once the full set of first-party
# third-party domains is confirmed.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://googletagmanager.com https://embed.tawk.to https://www.youtube.com https://www.youtube-nocookie.com https://assets.calendly.com https://tinder.thrivecart.com https://nomoneyblanks.thrivecart.com https://winning.jeldonmusic.com; style-src 'self' 'unsafe-inline' https://assets.calendly.com https://tinder.thrivecart.com https://nomoneyblanks.thrivecart.com https://winning.jeldonmusic.com; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://samply.app https://www.youtube.com https://www.youtube-nocookie.com https://calendly.com https://nomoneyblanks.thrivecart.com https://winning.jeldonmusic.com https://embed.tawk.to; media-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
